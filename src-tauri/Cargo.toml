[package]
name = "u-manga"
version = "0.1.0"
edition = "2024"
default-run = "u-manga"

[build-dependencies]
flate2 = "1"
tauri-build = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
umanga-core = { path = "../crates/core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
flate2 = "1"
parking_lot = "0.12"
tokio-util = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
axum = { version = "=0.8.6", features = ["http1", "json", "tokio", "query"], default-features = false }
argon2 = "=0.5.3"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
if-addrs = "=0.13.4"
uuid.workspace = true
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[workspace]
members = ["crates/core", "src-tauri"]
default-members = ["crates/core"]
resolver = "2"
exclude = ["vendor/genai"]

[patch.crates-io]
# Exact pinned 0.5.3 with a bounded non-streaming HTTP body reader; no adapter changes.
genai = { path = "vendor/genai" }

[profile.release]
lto = "thin"
codegen-units = 8
strip = true

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }

# Override with CARGO_PROFILE_DEV_DEBUG=2 / CARGO_INCREMENTAL=1 when debugging.
[profile.dev]
debug = 1
incremental = false
